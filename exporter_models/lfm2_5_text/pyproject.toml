# Per-model export environment for lfm2_5_text.
#   uv run --project exporter_models/lfm2_5_text exporter export lfm2_5_text --size 350m --output-dir <dir>
#
# Unlike the other models (executorch 1.3.1 + torch 2.14 nightly), this one uses
# the executorch export_llama path, which dlopens the ET runtime pybindings
# (_portable_lib). The 1.3.1 *wheel*'s runtime lib is ABI-incompatible with the
# torch 2.14 nightly (missing c10::impl::cow::materialize_cow_storage), so pin a
# date-matched executorch NIGHTLY whose runtime lib matches the torch nightly.
[project]
name = "exporter-model-lfm2-5-text"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260729",
    "executorch==1.4.0.dev20260729",
    "torchao==0.18.0.dev20260729",
    "safetensors==0.8.0",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
torch = { index = "pytorch-nightly" }
executorch = { index = "pytorch-nightly" }
torchao = { index = "pytorch-nightly" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
