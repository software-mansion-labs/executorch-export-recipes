# Per-model export environment for clip_vit_base_patch32_text (pinned, verified stack).
#   uv run --project exporter_models/clip_vit_base_patch32_text exporter export clip_vit_base_patch32_text --backend <b> --output-dir <dir>
[project]
name = "exporter-model-clip-vit-base-patch32-text"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260702",
    "executorch==1.3.1",
    "transformers==5.14.1",
    "safetensors==0.8.0",
]

[tool.uv]
# Exports run only on this macOS arm64 host; limit resolution to it so the
# nightly torch/torchvision +cpu-vs-plain platform split can't fail the lock.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
torch = { index = "pytorch-nightly" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
