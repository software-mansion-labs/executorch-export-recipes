# Per-model Vulkan export environment for clip_vit_base_patch32_text.
#   uv run --project exporter_models/clip_vit_base_patch32_text/vulkan exporter export clip_vit_base_patch32_text --backend vulkan --output-dir <dir>
#
# NOTE (VULKAN EXPORTER SOURCE PIN):
# executorch is pinned to software-mansion-labs/executorch, branch
# @ms/separate-backends-1.4.1, matching the Vulkan runtime this .pte targets.
# The pin is a version lock against the runtime rather than a need for any
# fork-only AOT pass: a released 1.4.1 serializes the same program.
#
# Drop the pin back to a released executorch once the runtime bump lands.
[project]
name = "exporter-model-clip-vit-base-patch32-text-vulkan"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260702",
    "executorch",
    "transformers==5.14.1",
    "safetensors==0.8.0",
]

[tool.uv]
# Exports run only on this macOS arm64 host; limit resolution to it so the
# nightly torch/torchvision +cpu-vs-plain platform split can't fail the lock.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../../.." , editable = true }
torch = { index = "pytorch-nightly" }
executorch = { git = "https://github.com/software-mansion-labs/executorch", branch = "@ms/separate-backends-1.4.1" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
