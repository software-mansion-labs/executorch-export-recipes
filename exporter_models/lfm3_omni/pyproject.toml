# MLX export requires the runtime-compatible source fork described in NOTES.md.
[project]
name = "exporter-model-lfm3-omni"
version = "0"
requires-python = "==3.10.*"
dependencies = ["exporter", "torch==2.14.0", "executorch", "torchao==0.18.0", "safetensors==0.8.0", "huggingface_hub==1.33.0", "transformers==5.14.1"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
executorch = { git = "https://github.com/software-mansion-labs/executorch", rev = "0a0871900c8f63a032981ac4748b9cdda84bfcb8" }
