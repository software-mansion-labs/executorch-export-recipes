# Per-model export environment for gemma4_omni (mlx + xnnpack + vulkan backends).
#
# NO uv.lock IS GENERATED. Every backend here needs a native ExecuTorch source
# build (buck2/cmake/submodules) that `uv sync` cannot produce:
#   - mlx     -> the software-mansion-labs fork, branch @ms/separate-backends,
#                version-locked to the MLX runtime.
#   - vulkan  -> patched backends/vulkan/ kernels (softmax max-subtraction,
#                gelu/tanh fp16 clamp, GemmaSDPA.cpp, resize_fn fixes) that live
#                in a SEPARATE repository and are not vendored here.
#   - xnnpack -> would be wheel-installable on its own, but shares the tree.
# Run these exports in the ET-source dev env. The published .pte ships on HF.
# This file records the pinned intent + fork source.
#
# CAVEAT: the pins below are the MLX-verified stack. The xnnpack and vulkan
# recipes were validated on a DIFFERENT one -- python
# 3.12.13, torch 2.11.0, transformers 5.7.0, torchao 0.15.0+git9338966da -- and
# have never been re-verified here. See NOTES.md, "Dependency stacks are
# unreconciled".
[project]
name = "exporter-model-gemma4-omni"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260702",
    "executorch",
    "safetensors==0.8.0",
    "torchao==0.18.0.dev20260702",
    "transformers==5.14.1",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
torch = { index = "pytorch-nightly" }
torchao = { index = "pytorch-nightly" }
# MLX runtime-locked fork -- native source build (see header).
executorch = { git = "https://github.com/software-mansion-labs/executorch", branch = "@ms/separate-backends" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
