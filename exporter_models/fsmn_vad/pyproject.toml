# Per-model export environment for fsmn_vad (pinned, verified stack).
#   uv run --project exporter_models/fsmn_vad exporter export fsmn_vad --backend <b> --output-dir <dir>
[project]
name = "exporter-model-fsmn-vad"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260702",
    "torchaudio==2.11.0.dev20260702",
    "executorch==1.4.1",
    "safetensors==0.8.0",
    "funasr==1.3.14",
    "numpy==2.0.0",
]

[tool.uv]
# Exports run only on this macOS arm64 host; limit resolution to it so the
# nightly torch/torchvision +cpu-vs-plain platform split can't fail the lock.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
torch = { index = "pytorch-nightly" }
torchaudio = { index = "pytorch-nightly" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
