# Per-model export environment for supertonic-3 (pinned, verified stack).
#   uv run --project exporter_models/supertonic-3 exporter export supertonic-3 --backend mlx --output-dir <dir>
#
# Weights are the upstream Supertone/supertonic-3 ONNX files: export.py fetches
# them from HF and convert.py extracts the four sub-model state dicts (needs
# `onnx`). One export emits four .pte (multi_pte) mirroring the ONNX layout.
#
# NOTE (MLX EXPORTER SOURCE PIN):
# executorch is pinned to Software Mansion's custom repository and commit
# (software-mansion-labs/executorch@10f535e) which contains the custom MLX pattern
# fusions, op handlers, and flatbuffer schema serializer required by react-native-executorch.
[project]
name = "exporter-model-supertonic-3"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260702",
    "executorch",
    "onnx==1.17.0",
    "numpy==2.0.0",
    "safetensors==0.8.0",
]

[tool.uv]
# Exports run only on this macOS arm64 host; limit resolution to it so the
# nightly torch +cpu-vs-plain platform split can't fail the lock.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
torch = { index = "pytorch-nightly" }
executorch = { git = "https://github.com/software-mansion-labs/executorch.git", rev = "10f535e4bd0e618285333b8bcd6ef3b02fa97105" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
