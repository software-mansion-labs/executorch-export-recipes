# Per-model export environment for facemesh (pinned, verified stack).
#   uv run --project exporter_models/facemesh exporter export facemesh --backend <b> --output-dir <dir>
#
# torch is the 2.14.0 release rather than a dated nightly: ExecuTorch 1.4.1 asks
# only for torch>=2.13.0a0, and the nightly index prunes old dev builds, so a
# dated pin stops resolving a few months on.
[project]
name = "exporter-model-facemesh"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0",
    "executorch==1.4.1",
    "coremltools==9.0",
    "safetensors==0.8.0",
]

[tool.uv]
# Exports run only on this macOS arm64 host; limit resolution to it so the
# torch +cpu-vs-plain platform split can't fail the lock.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
