[project]
name = "exporter-model-nemotron3-diarization"
version = "0"
requires-python = "==3.10.*"
dependencies = [
  "exporter",
  "torch==2.14.0",
  "executorch==1.4.1",
  "transformers==5.20.0",
  "safetensors==0.8.0",
  "soundfile==0.13.1",
  "librosa==0.11.0",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
