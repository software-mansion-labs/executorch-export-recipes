# Per-model export environment for distiluse_base_multilingual_cased_v2 (pinned, verified stack).
#   uv run --project exporter_models/distiluse_base_multilingual_cased_v2 exporter export distiluse_base_multilingual_cased_v2 --backend <b> --output-dir <dir>
[project]
name = "exporter-model-distiluse-base-multilingual-cased-v2"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260702",
    "executorch==1.4.1",
    "sentence-transformers==5.6.0",
    "safetensors==0.8.0",
    "torchao==0.18.0",
    "coremltools==9.0",
]

[tool.uv]
# Exports run only on this macOS arm64 host; limit resolution to it so the
# nightly torch/torchvision +cpu-vs-plain platform split can't fail the lock.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
torch = { index = "pytorch-nightly" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
