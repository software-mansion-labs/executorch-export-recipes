# Per-model export environment for sdxs_512_dreamshaper XNNPACK & CoreML.
#   uv run --project exporter_models/sdxs_512_dreamshaper exporter export sdxs_512_dreamshaper --backend <b> --output-dir <dir>
#
# The MLX backend needs the software-mansion-labs executorch fork and has its own
# pyproject.toml: exporter_models/sdxs_512_dreamshaper/mlx/pyproject.toml.
[project]
name = "exporter-model-sdxs-512-dreamshaper"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260702",
    "executorch==1.4.1",
    "transformers==5.14.1",
    "safetensors==0.8.0",
    "diffusers==0.39.0",
    "coremltools==9.0",
    "numpy==2.0.0",
]

[tool.uv]
# Exports run only on this macOS arm64 host; limit resolution to it so the
# nightly torch/torchvision +cpu-vs-plain platform split can't fail the lock.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
torch = { index = "pytorch-nightly" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
