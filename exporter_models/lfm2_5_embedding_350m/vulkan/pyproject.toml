# Per-model Vulkan export environment for lfm2_5_embedding_350m.
#   uv run --project exporter_models/lfm2_5_embedding_350m/vulkan exporter export lfm2_5_embedding_350m --backend vulkan --output-dir <dir>
#
# NOTE (VULKAN EXPORTER SOURCE PIN):
# executorch is pinned to software-mansion-labs/executorch, branch
# @ms/separate-backends-1.4.1, matching the Vulkan runtime this .pte targets.
# A released executorch 1.4.1 serializes weights through the deprecated
# constant_buffer path, which the Vulkan runtime rejects at load:
#   constant_buffer path is disabled (ET_ENABLE_DEPRECATED_CONSTANT_BUFFER=0)
#   -> getTensorDataPtr() failed: 0x23
#
# Drop the pin back to a released executorch once the branch lands upstream.
[project]
name = "exporter-model-lfm2-5-embedding-350m-vulkan"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260702",
    "executorch",
    "transformers==5.14.1",
    "safetensors==0.8.0",
    "torchao",
]

[tool.uv]
# Exports run only on this macOS arm64 host; limit resolution to it so the
# nightly torch/torchvision +cpu-vs-plain platform split can't fail the lock.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../../.." , editable = true }
torch = { index = "pytorch-nightly" }
executorch = { git = "https://github.com/software-mansion-labs/executorch", branch = "@ms/separate-backends-1.4.1" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
