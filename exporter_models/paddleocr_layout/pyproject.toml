# Per-model export environment for paddleocr_layout (PP-DocLayoutV3) — pinned,
# verified stack.
#   uv run --project exporter_models/paddleocr_layout exporter export paddleocr_layout --backend <b> --output-dir <dir>
#
# `PPDocLayoutV3ForObjectDetection` lives in UPSTREAM transformers (landed in
# 5.14.x) — the PaddlePaddle transformers fork the exporter originally needed is
# obsolete. Pillow loads the REAL verification image the trace runs on (tracing
# on synthetic noise elides the contiguity copies and yields a broken PTE, see
# NOTES.md); torchao is carried only for the in-tree int8wo bridge, which the
# shipped fp32/fp16 recipes do not use.
[project]
name = "exporter-model-paddleocr-layout"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260702",
    "torchao==0.18.0",
    "executorch==1.4.1",
    "transformers==5.14.1",
    "safetensors==0.8.0",
    "coremltools==9.0",
    "pillow==12.3.0",
    "numpy==2.0.0",
]

[tool.uv]
# Exports run only on this macOS arm64 host; limit resolution to it so the
# nightly torch +cpu-vs-plain platform split can't fail the lock.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
torch = { index = "pytorch-nightly" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
