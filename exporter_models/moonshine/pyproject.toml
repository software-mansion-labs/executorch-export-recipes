# Per-model export environment for moonshine (pinned, verified stack).
#   uv run --project exporter_models/moonshine exporter export moonshine --output-dir <dir>
#
# moonshine is a Keras model converted to torch (KERAS_BACKEND=torch). keras /
# keras-hub / einops versions are resolved by uv (not in the frozen executorch
# env); pins below are what uv locked as compatible with the torch nightly.
[project]
name = "exporter-model-moonshine"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260702",
    "executorch==1.3.1",
    "safetensors==0.8.0",
    "keras==3.12.4",
    "keras-hub==0.25.1",
    "einops==0.8.2",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
torch = { index = "pytorch-nightly" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
