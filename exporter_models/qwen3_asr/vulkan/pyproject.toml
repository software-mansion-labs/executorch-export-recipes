# Per-model Vulkan export environment for qwen3_asr.
#   Not uv-runnable: the executorch fork pin below cannot be built by uv (see
#   skills/backends/vulkan, "Environment"). From a fork-overlaid env:
#   PYTHONPATH=src python -m exporter.cli export qwen3_asr --backend vulkan --output-dir <dir>
#
# NOTE (VULKAN EXPORTER SOURCE PIN):
# executorch comes from software-mansion-labs/executorch, branch
# @ms/separate-backends-1.4.1, matching the Vulkan runtime these .pte files
# target (a .pte run against a different shader tree yields gibberish, not an
# error). Same pin is used by mlx/.
[project]
name = "exporter-model-qwen3-asr-vulkan"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0",
    "executorch",
    "torchao==0.18.0",
    "transformers==5.14.1",
    "safetensors==0.8.0",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../../..", editable = true }
executorch = { git = "https://github.com/software-mansion-labs/executorch", branch = "@ms/separate-backends-1.4.1" }
