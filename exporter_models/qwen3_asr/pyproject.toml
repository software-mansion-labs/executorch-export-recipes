# Per-model export environment for qwen3_asr (XNNPACK).
#   uv run --project exporter_models/qwen3_asr exporter export qwen3_asr --backend xnnpack --output-dir <dir>
#
# The MLX and Vulkan exports need the software-mansion-labs fork built from
# source; see mlx/pyproject.toml and vulkan/pyproject.toml.
[project]
name = "exporter-model-qwen3-asr"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0",
    "executorch==1.4.1",
    "torchao==0.18.0",
    "transformers==5.14.1",
    "safetensors==0.8.0",
]

[tool.uv]
# Exports run only on this macOS arm64 host; limit resolution to it so the
# torch +cpu-vs-plain platform split can't fail the lock.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
