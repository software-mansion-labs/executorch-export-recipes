# Per-model export environment for whisper XNNPACK & CoreML (pinned executorch==1.2.0 stack).
#   uv run --project exporter_models/whisper exporter export whisper --backend xnnpack --output-dir <dir>
#
# NOTE: CoreML export requires ExecuTorch 1.2.0 (fails on 1.3.1).
# The MLX backend requires ExecuTorch 1.3.1+, so MLX export uses its own pyproject.toml:
#   uv run --project exporter_models/whisper/mlx exporter export whisper --backend mlx --output-dir <dir>
[project]
name = "exporter-model-whisper"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260702",
    "executorch==1.2.0",
    "transformers==5.14.1",
    "safetensors==0.8.0",
    "torchao==0.18.0.dev20260702",
    "coremltools==9.0",
    "numpy==2.0.0",
    "tqdm==4.67.3",
]

[tool.uv]
# Exports run only on this macOS arm64 host; limit resolution to it so the
# nightly torch/torchvision +cpu-vs-plain platform split can't fail the lock.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
torch = { index = "pytorch-nightly" }
torchao = { index = "pytorch-nightly" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
