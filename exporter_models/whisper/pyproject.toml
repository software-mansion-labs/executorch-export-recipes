# Per-model export environment for whisper (pinned, verified stack).
#   uv run --project exporter_models/whisper exporter export whisper --backend <b> --output-dir <dir>
#
# NOTE: the `mlx` backend REQUIRES executorch built from the software-mansion-labs
# fork (branch @ms/separate-backends), version-locked to the MLX runtime. That is
# a native source build (buck2/cmake/submodules) that `uv sync` cannot produce
# here, so it is NOT reflected below: the committed uv.lock and the pinned
# executorch==1.3.1 cover only the xnnpack + coreml exports. Adding the git fork
# source here would break xnnpack/coreml locking, so the mlx export instead runs
# in the ET-source dev env (matching efficientnet_v2_s, which likewise keeps
# executorch==1.3.1 while listing mlx as a backend).
[project]
name = "exporter-model-whisper"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260702",
    "executorch==1.3.1",
    "transformers==5.14.1",
    "safetensors==0.8.0",
    "torchao==0.18.0.dev20260702",
    "coremltools==9.0",
    "numpy==2.0.0",
    "tqdm==4.67.3",
]

[tool.uv]
# Exports run only on this macOS arm64 host; limit resolution to it so the
# nightly torch/torchvision +cpu-vs-plain platform split can't fail the lock.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
torch = { index = "pytorch-nightly" }
torchao = { index = "pytorch-nightly" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
