# Per-model MLX export environment for whisper (requires ExecuTorch 1.3.1+ for MLX delegate).
#   uv run --project exporter_models/whisper/mlx exporter export whisper --backend mlx --all-variants
[project]
name = "exporter-model-whisper-mlx"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260702",
    "executorch==1.4.1",
    "transformers==5.14.1",
    "safetensors==0.8.0",
    "torchao==0.18.0",
    "numpy==2.0.0",
    "tqdm==4.67.3",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../../..", editable = true }
torch = { index = "pytorch-nightly" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
