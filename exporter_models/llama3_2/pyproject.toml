# Per-model export environment for llama3_2 (XNNPACK), via executorch's export_llama.
#   uv run --project exporter_models/llama3_2 exporter export llama3_2 --size 1b --backend xnnpack --output-dir <dir>
#
# NOTE (EXECUTORCH SOURCE PIN):
# executorch is pinned to Software Mansion's repository and branch
# (software-mansion-labs/executorch, branch @ms/separate-backends-1.4.1) on top of
# ExecuTorch 1.4.1 -- the same source the other uv-run exports here use.
# It matters more than usual on this path: export_llama dlopens the ET runtime
# pybindings (_portable_lib), so the runtime lib has to be built against the same
# torch as the rest of the env. A released wheel next to a torch nightly is not
# (that ABI break is what pinned lfm2_5_text to a date-matched ET nightly).

[project]
name = "exporter-model-llama3-2"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0.dev20260702",
    "executorch",
    "torchao==0.18.0",
    "safetensors==0.8.0",
]

[tool.uv]
# Exports run only on this macOS arm64 host; limit resolution to it so the
# nightly torch +cpu-vs-plain platform split can't fail the lock.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
torch = { index = "pytorch-nightly" }
executorch = { git = "https://github.com/software-mansion-labs/executorch", branch = "@ms/separate-backends-1.4.1" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true
