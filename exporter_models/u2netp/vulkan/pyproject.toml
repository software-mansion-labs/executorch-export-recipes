# Vulkan AOT code targets the fork used by RNE's Android delegate.
# uv cannot build this fork directly; see NOTES.md for the export environment.
[project]
name = "exporter-model-u2netp-vulkan"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0",
    "executorch",
    "safetensors==0.8.0",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
executorch = { git = "https://github.com/software-mansion-labs/executorch", branch = "@ms/separate-backends-1.4.1" }
exporter = { path = "../../..", editable = true }
