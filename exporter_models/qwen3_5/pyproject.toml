[project]
name = "exporter-model-qwen3-5"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "exporter",
    "torch==2.14.0",
    "executorch==1.4.1",
    "torchao==0.18.0",
    "safetensors==0.8.0",
    "transformers==5.14.1",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
exporter = { path = "../..", editable = true }
