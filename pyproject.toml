[project]
name = "exporter"
version = "0.1.0"
description = "Universal ExecuTorch export harness"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "huggingface_hub",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
exporter = "exporter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exporter"]

[tool.pytest.ini_options]
markers = ["requires_et: needs ExecuTorch installed to run"]
