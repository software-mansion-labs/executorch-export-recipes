[project]
name = "exporter"
version = "0.1.0"
description = "Universal ExecuTorch export harness"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "huggingface_hub",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = ["pytest"]
# Per-model export dependencies, grouped by stack. A model.json names the
# extra(s) it needs in its "extras" list; install with e.g.
#   pip install -e ".[coreml,detection]"
# (executorch, and MLX for the mlx backend, are environment prerequisites
# installed separately, not pip extras.)
coreml = ["coremltools"]
quant = ["torchao"]
detection = ["rfdetr", "ultralytics", "numpy"]
diffusion = ["diffusers"]
asr = ["numpy", "tqdm"]
vad = ["funasr", "numpy"]
tts = ["numpy"]
moonshine = ["keras", "keras-hub", "einops"]

[project.scripts]
exporter = "exporter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exporter"]

[tool.pytest.ini_options]
markers = ["requires_et: needs ExecuTorch installed to run"]
