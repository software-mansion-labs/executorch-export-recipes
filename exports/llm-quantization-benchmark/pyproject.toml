[project]
name = "llm-quantization-benchmark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "executorch>=1.1.0",
    "matplotlib>=3.10.8",
    "torch>=2.10.0",
    "huggingface-hub>=0.27",
    "transformers>=4.47",
    "datasets>=3.0",
    "psutil>=6.0",
    "tabulate>=0.9",
    "tqdm>=4.66",
    "plotly>=5.0",
    "jupyter>=1.1.1",
    "ipywidgets>=8.1.8",
    "deepeval>=3.8.9",
    "google-genai>=1.67.0",
    "evaluate>=0.4.6",
    "faiss-cpu>=1.8.0",
    "mauve-text>=0.4.0",
]

[project.optional-dependencies]
# cleaner LLM inference API on top of ExecuTorch
optimum = ["optimum-executorch>=0.1"]

[dependency-groups]
dev = [
    "optimum-executorch",
]

[tool.uv.sources]
optimum-executorch = { git = "https://github.com/huggingface/optimum-executorch.git" }
